name: 💡 Feature Request
description: Propose a new feature, model architecture, or enhancement for SkillLens
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate ideas for making SkillLens more accurate, explainable, and intuitive!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific problem or user workflow?
      placeholder: A clear and concise description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see implemented.
      placeholder: Detailed description of the feature or behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought of?

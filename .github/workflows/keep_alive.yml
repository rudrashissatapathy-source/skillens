name: Streamlit Keep-Alive & Uptime Monitor

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to prevent Streamlit inactivity hibernation
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Streamlit App URL to ping'
        required: false
        default: 'https://skillens.streamlit.app'

jobs:
  ping-streamlit:
    name: Ping Streamlit Application
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Application
        run: |
          TARGET_URL="${{ github.event.inputs.target_url || secrets.STREAMLIT_APP_URL || 'https://skillens.streamlit.app' }}"
          echo "Pinging Streamlit App at: $TARGET_URL"
          
          # Perform curl request with follow-redirects and timeout
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$TARGET_URL" || true)
          echo "Received HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 302 ] || [ "$HTTP_STATUS" -eq 303 ]; then
            echo "✅ Streamlit application is online and responsive (HTTP $HTTP_STATUS)."
          else
            echo "⚠️ Received HTTP status $HTTP_STATUS. App may be cold-starting or hibernated. Sending secondary wake request..."
            curl -sL --max-time 60 "$TARGET_URL" > /dev/null || true
            echo "Wake request dispatched successfully."
          fi

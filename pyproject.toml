[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllens"
version = "1.0.0"
description = "AI-Powered Student Placement Readiness & Career Intelligence Engine with SHAP Explainability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rudrashis Satapathy", email = "rudrashissatapathy@gmail.com" }
]
keywords = [
    "machine-learning",
    "placement-prediction",
    "explainable-ai",
    "shap",
    "xgboost",
    "streamlit",
    "scikit-learn",
    "career-intelligence",
    "data-science"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.18.0",
    "joblib>=1.3.0",
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/rudrashissatapathy-source/skillens"
Repository = "https://github.com/rudrashissatapathy-source/skillens"
Issues = "https://github.com/rudrashissatapathy-source/skillens/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
norecursedirs = ["venv", ".venv", ".git", "__pycache__", "build", "dist"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
